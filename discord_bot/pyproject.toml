[project]
name = "guilddesk-discord-bot"
version = "0.1.0"
description = "GuildDesk Discord bot — an independent client of the platform's HTTP API, never imports app/ directly"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3.2,<3.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["discord_bot/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_bot"]
