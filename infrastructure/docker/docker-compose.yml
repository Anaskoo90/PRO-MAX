# Local development environment only. Cloud provider for staging/prod
# infrastructure is still undecided (standing gap, restated from the
# Enterprise Architecture pack) — this file covers local dev exclusively.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guilddesk
      POSTGRES_PASSWORD: guilddesk
      POSTGRES_DB: guilddesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit:v1.30.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guilddesk
      MINIO_ROOT_PASSWORD: guilddesk-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 guilddesk guilddesk-dev-secret &&
      mc mb --ignore-existing local/guilddesk"

volumes:
  pgdata:
  minio_data:
