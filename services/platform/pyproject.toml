[project]
name = "guilddesk-platform"
version = "0.1.0"
description = "GuildDesk platform monolith: bounded-context modules + platform_core foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.9.0",
    "aiofiles>=24.1.0",
    "aioboto3>=13.0.0",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
